[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mac-maestro"
version = "0.2.1"
description = "Semantic-first macOS GUI automation with safety gates and structured traces."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Borja Moskv" }
]
keywords = [
  "macos",
  "accessibility",
  "automation",
  "gui-automation",
  "agent-safety",
  "semantic-automation",
  "mcp",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "pydantic>=2.8.0,<3.0.0",
  "mcp>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/borjamoskv/mac-maestro"
Repository = "https://github.com/borjamoskv/mac-maestro"
Issues = "https://github.com/borjamoskv/mac-maestro/issues"

[project.optional-dependencies]
mcp = [
  "mcp[cli]>=1.0.0",
]
macos = [
  "pyobjc-core>=10.3; platform_system == 'Darwin'",
  "pyobjc-framework-Cocoa>=10.3; platform_system == 'Darwin'",
  "pyobjc-framework-Quartz>=10.3; platform_system == 'Darwin'",
  "pyobjc-framework-ApplicationServices>=10.3; platform_system == 'Darwin'",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[project.scripts]
mac-maestro-mcp = "mac_maestro.mcp_server:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.hatch.build.targets.wheel]
packages = ["src/mac_maestro"]
